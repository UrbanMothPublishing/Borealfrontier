<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FitLaunch demo · creator setup and follower app</title>
<link rel="icon" href="/fitlaunch-icon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b1513;color:#f4f1ea;display:flex;flex-direction:column;align-items:center;padding:20px 12px 40px;min-height:100vh}
  .note{color:#b9c6c0;font-size:13px;max-width:420px;text-align:center;margin-bottom:14px;line-height:1.45}
  .note b{color:#f4f1ea}
  #phone{width:390px;max-width:100%;height:800px;background:#0b1513;border-radius:44px;border:10px solid #1f3a33;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  #screen{flex:1;overflow-y:auto;padding:22px 18px 18px}
  #tabs{display:flex;border-top:1px solid #22332f;background:#0f1c19;padding:8px 4px 14px}
  #tabs button{flex:1;background:none;border:none;color:#8fa39b;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0}
  #tabs button .i{font-size:19px}
  #tabs button.on{color:#ff5b4f}
  h1{font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
  h2{font-size:20px;font-weight:700;margin-bottom:12px}
  h3{font-size:16px;font-weight:700}
  .muted{color:#b9c6c0;font-size:14px;line-height:1.45}
  .small{font-size:12px;color:#b9c6c0}
  .btn{display:block;width:100%;background:#e0362a;color:#ffffff;font-weight:800;font-size:17px;border:none;border-radius:16px;padding:17px;cursor:pointer;margin-top:14px}
  .btn.ghost{background:#182b27;color:#f4f1ea;font-weight:600}
  .card{background:#13221f;border-radius:18px;padding:16px;margin-bottom:12px}
  .hero{border-radius:22px;padding:20px;background:linear-gradient(135deg,#3a1714,#13221f 70%);margin-bottom:14px}
  .thumb{border-radius:14px;background:linear-gradient(135deg,#1f3a33,#10201c);display:flex;align-items:center;justify-content:center;color:#b9c6c0;font-size:13px;flex-shrink:0}
  .row{display:flex;gap:12px;align-items:center}
  .pill{display:inline-block;background:#22332f;color:#d8e0dc;border-radius:99px;padding:5px 11px;font-size:12px;margin:0 6px 6px 0;cursor:pointer;border:none}
  .pill.on{background:#e0362a;color:#ffffff;font-weight:700}
  .opt{display:block;width:100%;text-align:left;background:#13221f;border:2px solid #22332f;color:#f4f1ea;border-radius:16px;padding:17px;font-size:16px;margin-bottom:10px;cursor:pointer}
  .opt:hover{border-color:#e0362a}
  .avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#e0362a,#a81f15);display:flex;align-items:center;justify-content:center;font-weight:800;color:#ffffff;flex-shrink:0}
  .ex{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #22332f;font-size:15px}
  .ex:last-child{border:none}
  .bubble{max-width:80%;padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.4;margin-bottom:8px}
  .me{background:#e0362a;color:#ffffff;margin-left:auto;border-bottom-right-radius:5px}
  .them{background:#182b27;border-bottom-left-radius:5px}
  .big{font-size:52px;font-weight:800;color:#ff5b4f;line-height:1}
  .week{display:flex;justify-content:space-between;margin-top:12px}
  .day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:#b9c6c0}
  .dot{width:30px;height:30px;border-radius:50%;background:#22332f;display:flex;align-items:center;justify-content:center;font-size:13px}
  .dot.done{background:#e0362a;color:#ffffff;font-weight:800}
  .badge{background:#182b27;border-radius:16px;padding:14px 8px;text-align:center;font-size:12px;color:#d8e0dc}
  .badge .e{font-size:26px;display:block;margin-bottom:6px}
  .badge.locked{opacity:.35}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .msgbtn{background:#182b27;color:#f4f1ea;border:1px solid #2e4a43;border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
  .back{background:none;border:none;color:#ff5b4f;font-size:15px;cursor:pointer;margin-bottom:14px;padding:0}
  .progress{height:5px;background:#22332f;border-radius:9px;overflow:hidden;margin:8px 0}
  .progress div{height:100%;background:#e0362a}
  .timer{font-size:72px;font-weight:800;text-align:center;color:#ff5b4f;margin:16px 0}
  input.msg{flex:1;background:#182b27;border:none;border-radius:99px;padding:13px 16px;color:#f4f1ea;font-size:15px}
  .send{background:#e0362a;border:none;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer}
  .center{text-align:center}
  .lock{font-size:12px;background:#22332f;color:#d8e0dc;padding:3px 8px;border-radius:8px}
  .modes{width:390px;max-width:100%;display:flex;gap:6px;margin-bottom:12px}
  .modes button{flex:1;background:#10201c;border:1px solid #2e4a43;color:#b9c6c0;border-radius:12px;padding:10px 6px;font-size:12px;font-weight:700;cursor:pointer}
  .modes button.on{background:#e0362a;border-color:#e0362a;color:#fff}
  .step{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#ff5b4f;margin-bottom:10px}
  .field{display:block;width:100%;background:#10201c;border:1px solid #2e4a43;color:#f4f1ea;border-radius:12px;padding:13px 14px;font-size:15px;font-family:inherit;margin-top:6px}
  .lbl{font-size:12px;color:#b9c6c0;font-weight:600;display:block;margin-top:14px}
  .chk{display:flex;gap:12px;align-items:center;padding:10px 0;font-size:15px}
  .chk .ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
  .sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer}
  .sw.on{border-color:#f4f1ea}
  .warn{background:#2b2010;border:1px solid #6b4d1a;color:#f3d9a4;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:10px}
  .ok{background:#10261c;border:1px solid #1f5a3d;color:#bfe8cf;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:10px}
  .tagai{font-size:11px;color:#8fa39b}
  .tagai.low{color:#f3b45a}
  .spin{width:16px;height:16px;border:2px solid #2e4a43;border-top-color:#ff5b4f;border-radius:50%;animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
<style id="accent"></style>
<script>

<div style="width:390px;max-width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px"><a href="/free-app/" style="display:flex;align-items:center;gap:10px;text-decoration:none"><svg width="34" height="34" viewBox="0 0 1080 1080" style="display:block"><rect width="1080" height="1080" rx="240" fill="#e0362a"/><g fill="#f4f1ea"><rect x="300" y="300" width="96" height="480" rx="10"/><rect x="300" y="300" width="300" height="92" rx="10"/><path d="M560 250 L720 346 L560 442 Z"/><rect x="300" y="500" width="230" height="88" rx="10"/><rect x="610" y="420" width="96" height="360" rx="10"/><rect x="610" y="692" width="200" height="88" rx="10"/></g></svg><span style="font-weight:800;font-size:22px;letter-spacing:-.5px;color:#f4f1ea">Fit<span style="color:#ff5b4f">Launch</span></span></a><a href="/free-app/" onclick="posthog.capture('free_app_link_clicked',{from:'demo'})" style="background:#e0362a;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:9px 14px;border-radius:99px">Get your own app, free</a></div>
<div class="modes">
  <button id="mC" onclick="startCreator()">1 · Creator setup</button>
  <button id="mF" onclick="startFollower()">2 · Follower app</button>
  <button id="mD" onclick="go({view:'c_dash'})">3 · Creator dashboard</button>
</div>
<p class="note"><b>How FitLaunch works, start to finish.</b> Set up an app as a creator, then open it as a follower. Everything here is sample data: nothing connects to Instagram or charges money.</p>
<div id="phone">
  <div id="screen"></div>
  <nav id="tabs"></nav>

<script>
const CREATOR = { name: "Sam", handle: "@samlifts", initial: "S" };
function setName(v){ v=v.trim(); CREATOR.name=v||"Your Name"; CREATOR.initial=(v[0]||"Y").toUpperCase(); render(); }
function setHandle(v){ v=v.trim().replace(/^@+/,"").replace(/[^A-Za-z0-9._]/g,"").replace(/\.+$/,""); CREATOR.handle=v?"@"+v:"@yourhandle"; render(); }
function esc(t){ return t.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function setBio(v){ S.bio=v.trim(); render(); }

const S = {
  view: "c_start", tab: "today", account: false, price: "$14.99", accent: "#e0362a", approved: {0:true,1:true,2:true,3:true}, removed: {}, build: 0, plan: 0, payoutSet: false, copied: false, photo: null, q: 0, answers: {}, subscribed: false,
  streak: 4, doneToday: false, program: null, filter: "All",
  player: { ex: 0, set: 1, resting: false, t: 0 },
  messages: [
    { me: false, text: "Welcome to the crew! Drop me a message any time — form checks, swaps for bad knees, whatever you need." },
    { me: true, text: "Hey __NAME__, my lower back gets tight on swings. Should I go lighter?" },
    { me: false, text: "Probably, yes. Drop to a lighter bell and focus on snapping your hips forward, not lifting with your back. Send me a side-on video next session and I'll take a look." }
  ]
};
let timerId = null;

const QUIZ = [
  { q: "What's your main goal?", opts: ["Build strength", "Lose body fat", "Move and feel better", "All of the above"] },
  { q: "What do you have at home?", opts: ["Kettlebells", "Kettlebells, bands and a pull-up bar", "Just my bodyweight"] },
  { q: "How many days a week can you train?", opts: ["2 days", "3 days", "4 days"] }
];

const TODAY = {
  title: "Kettlebell Strength A", label: "Week 2 · Day 1", mins: 35,
  exercises: [
    { name: "Kettlebell Swing", sets: 4, reps: "15 reps" },
    { name: "Goblet Squat", sets: 3, reps: "10 reps" },
    { name: "Single-Arm Kettlebell Row", sets: 3, reps: "10 each side" },
    { name: "Pull-Up (band-assisted if needed)", sets: 3, reps: "as many as you can" },
    { name: "Suitcase Carry", sets: 3, reps: "40 sec each side" }
  ]
};

const PROGRAMS = [
  { name: "Home Gym Strength", weeks: 8, days: 3, level: "Beginner", desc: "Full-body strength with kettlebells and a pull-up bar. Three 35-minute sessions a week.", progress: 0.12 },
  { name: "Pull-Up Progression", weeks: 6, days: 3, level: "All levels", desc: "From band-assisted to your first strict pull-ups, then more.", progress: 0 },
  { name: "Clubs & Mobility", weeks: 4, days: 4, level: "All levels", desc: "Indian clubs and mace work for healthy shoulders, hips and back.", progress: 0 },
  { name: "Short on Time", weeks: 4, days: 4, level: "Intermediate", desc: "20-minute kettlebell sessions for busy weeks.", progress: 0 }
];

const VIDEOS = [
  { name: "Kettlebell swing: hinge, don't squat", part: "Kettlebell", eq: "Kettlebell", min: 2 },
  { name: "Pull complex", part: "Pull-up bar", eq: "Pull-up bar", min: 3 },
  { name: "Goblet squat setup", part: "Kettlebell", eq: "Kettlebell", min: 1 },
  { name: "Club mill for shoulders", part: "Clubs & mace", eq: "Indian clubs", min: 2 },
  { name: "Mace 360 basics", part: "Clubs & mace", eq: "Steel mace", min: 3 },
  { name: "Band pull-aparts", part: "Bands", eq: "Resistance band", min: 1 },
  { name: "Band-assisted pull-up", part: "Pull-up bar", eq: "Band + bar", min: 2 },
  { name: "Hip and back mobility flow", part: "Bodyweight", eq: "None", min: 8 }
];
const FILTERS = ["All", "Kettlebell", "Pull-up bar", "Clubs & mace", "Bands", "Bodyweight"];

const $ = id => document.getElementById(id);
function go(patch) { Object.assign(S, patch); render(); }

function render() {
  const sc = $("screen"), tabs = $("tabs");
  const inApp = S.view === "app";
  tabs.style.display = inApp ? "flex" : "none";
  sc.innerHTML = withTop(VIEWS[S.view]().split("__NAME__").join(CREATOR.name));
  sc.scrollTop = 0;
  if (inApp) {
    const t = [["today","🏠","Today"],["programs","📋","Programs"],["library","▶️","Library"],["gear","🛍️","My Gear"],["progress","📈","Progress"]];
    tabs.innerHTML = t.map(([k,i,l]) => `<button class="${S.tab===k?'on':''}" onclick="go({tab:'${k}',program:null})"><span class="i">${i}</span>${l}</button>`).join("");
  }
  if (S.view === "app" && S.tab === "coach") {
    const box = $("chat"); if (box) box.scrollTop = box.scrollHeight;
  }
}

const VIEWS = {
  welcome: () => `
    <div style="height:100%;display:flex;flex-direction:column;justify-content:space-between">
      <div>
        ${S.photo
          ? `<div style="height:340px;border-radius:22px;margin-bottom:22px;background:url('${S.photo}') center/cover;position:relative">
               <div style="position:absolute;inset:0;border-radius:22px;background:linear-gradient(transparent 55%,rgba(11,21,19,.85))"></div>
               <label class="pill" style="position:absolute;top:12px;right:12px;background:rgba(11,21,19,.7)">Change photo<input type="file" accept="image/*" onchange="addPhoto(this)" hidden></label>
             </div>`
          : `<label class="thumb" style="height:340px;font-size:15px;margin-bottom:22px;flex-direction:column;gap:8px;cursor:pointer;border:2px dashed #2e4a43">
               <span style="font-size:40px">📷</span><b>Tap to add ${CREATOR.name}'s photo</b><span class="small">Choose an image from your computer</span>
               <input type="file" accept="image/*" onchange="addPhoto(this)" hidden>
             </label>`}
        <p class="small" style="margin-bottom:6px">${CREATOR.handle}</p>
        <h1>Train with ${CREATOR.name}.</h1>
        <p class="muted" style="margin-top:10px;white-space:pre-line">${S.bio ? esc(S.bio) : "Home-gym strength programs built from my videos. Kettlebells, bands and a pull-up bar are all you need."}</p><p class="muted" style="margin-top:8px">Your first workout is free.</p>
      </div>
      <div><button class="btn" onclick="go({view:'quiz',q:0})">Start my free workout</button>
      <p class="small center" style="margin-top:12px;cursor:pointer" onclick="go({view:'f_login'})">Already a member? <u>Log in</u></p>
      <p class="small center" style="margin-top:10px;opacity:.7">Powered by <b style="color:#f4f1ea">Fit</b><b style="color:#ff5b4f">Launch</b></p></div>
    </div>`,

  quiz: () => {
    const Q = QUIZ[S.q];
    return `<button class="back" onclick="${S.q? `go({q:${S.q-1}})` : `go({view:'welcome'})`}">← Back</button>
      <div class="progress"><div style="width:${(S.q+1)/QUIZ.length*100}%"></div></div>
      <p class="small" style="margin:6px 0 18px">Question ${S.q+1} of ${QUIZ.length}</p>
      <h1 style="margin-bottom:22px">${Q.q}</h1>
      ${Q.opts.map(o => `<button class="opt" onclick="answer('${o}')">${o}</button>`).join("")}`;
  },

  plan: () => `
    <p class="small" style="margin-bottom:8px">Built for you</p>
    <h1>Your plan is ready.</h1>
    <div class="hero" style="margin-top:20px">
      <p class="small">PROGRAM</p>
      <h2 style="margin:4px 0 6px">Home Gym Strength</h2>
      <p class="muted">8 weeks · ${S.answers[2] || "3 days"} a week · ${S.answers[1] || "Kettlebells"}</p>
    </div>
    <div class="card"><p class="muted">__NAME__ picked this based on your goal: <b style="color:#f4f1ea">${S.answers[0] || "Build strength"}</b>. You can switch programs any time.</p></div>
    <button class="btn" onclick="go({view:'app',tab:'today'})">Let's go</button>`,

  app: () => TABS[S.tab](),

  player: () => {
    const p = S.player, ex = TODAY.exercises[p.ex], next = TODAY.exercises[p.ex+1];
    const pct = (p.ex / TODAY.exercises.length) * 100;
    if (p.resting) return `
      <button class="back" onclick="quitPlayer()">✕ End workout</button>
      <p class="small center" style="margin-top:40px">REST</p>
      <div class="timer" id="t">${p.t}</div>
      <p class="muted center">Next: ${p.set <= ex.sets ? `${ex.name}, set ${p.set} of ${ex.sets}` : (next ? next.name : "Finish")}</p>
      <button class="btn ghost" onclick="skipRest()">Skip rest</button>`;
    return `
      <button class="back" onclick="quitPlayer()">✕ End workout</button>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="thumb" style="height:250px;margin:14px 0 18px;flex-direction:column;gap:6px"><span style="font-size:42px">▶</span>__NAME__ demos: ${ex.name}</div>
      <p class="small">Exercise ${p.ex+1} of ${TODAY.exercises.length}</p>
      <h1 style="margin:4px 0 6px">${ex.name}</h1>
      <p style="font-size:22px;font-weight:700;color:#e0362a">Set ${p.set} of ${ex.sets} · ${ex.reps}</p>
      <button class="btn" style="padding:22px;font-size:19px" onclick="doneSet()">Done ✓</button>
      ${next ? `<p class="small center" style="margin-top:14px">Up next: ${next.name}</p>` : ""}`;
  },

  done: () => `
    <div class="center" style="padding-top:60px">
      <div style="font-size:64px">🔥</div>
      <h1 style="margin:14px 0 8px">Workout done.</h1>
      <p class="muted">That's ${S.streak} days in a row. __NAME__ would be proud.</p>
      <div class="card" style="margin-top:24px;text-align:left">
        <div class="row">${av()}
        <p class="muted" style="font-size:14px">"Great first session. Next one is upper body: see you Wednesday." <br><span class="small">__NAME__</span></p></div>
      </div>
      <button class="btn" onclick="go({view: S.subscribed ? 'app' : (S.account ? 'paywall' : 'f_signup'), tab:'today'})">Continue</button>
    </div>`,

  paywall: () => `
    <p class="small" style="margin-bottom:8px">You finished your free workout 💪</p>
    <h1>Keep training with __NAME__.</h1>
    <div class="card" style="margin-top:20px">
      ${["All 4 programs and every workout video","Your plan, updated as you get stronger","Message __NAME__ directly for advice","Track your streaks and progress"].map(t=>`<p style="padding:7px 0;font-size:15px">✓ ${t}</p>`).join("")}
    </div>
    <div class="hero center" style="border:2px solid #e0362a">
      <p style="font-size:30px;font-weight:800">${S.price}<span class="muted" style="font-size:15px"> / month</span></p>
      <p class="muted">7 days free, cancel anytime</p>
    </div>
    <button class="btn" onclick="go({subscribed:true,view:'app',tab:'today'})">Start my free week</button>
    <p class="small center" style="margin-top:12px;cursor:pointer" onclick="go({view:'app',tab:'today'})">Not now</p>`
};

const TABS = {
  today: () => `
    <div class="row" style="margin-bottom:20px">${av()}
      <div><p class="small">Good morning</p><h3>Day ${S.streak} streak 🔥</h3></div></div>
    <div class="hero">
      <p class="small">${TODAY.label} · Home Gym Strength</p>
      <h2 style="margin:6px 0 4px">${TODAY.title}</h2>
      <p class="muted">${TODAY.mins} min · ${TODAY.exercises.length} exercises</p>
      ${S.doneToday ? `<button class="btn ghost">✓ Done today</button>` : `<button class="btn" onclick="startWorkout()">▶ Start workout</button>`}
    </div>
    <div class="card"><h3 style="margin-bottom:6px">Today's workout</h3>
      ${TODAY.exercises.map(e=>`<div class="ex"><span>${e.name}</span><span class="small">${e.sets} × ${e.reps}</span></div>`).join("")}
    </div>
    <div class="card row" style="cursor:pointer" onclick="go({tab:'coach'})">${av()}
      <div><h3>New message from __NAME__</h3><p class="small">"Probably, yes. Drop to a lighter bell and…"</p></div></div>`,

  programs: () => {
    if (S.program !== null) {
      const p = PROGRAMS[S.program];
      return `<button class="back" onclick="go({program:null})">← Programs</button>
        <div class="thumb" style="height:180px;margin-bottom:16px;font-size:30px">📋</div>
        <h1>${p.name}</h1>
        <p class="muted" style="margin:8px 0 14px">${p.weeks} weeks · ${p.days} days/week · ${p.level}</p>
        <p class="muted">${p.desc}</p>
        <div class="card" style="margin-top:16px">

function av(style=""){
  return S.photo
    ? `<div class="avatar" style="${style};background:url('${S.photo}') center/cover"></div>`
    : `<div class="avatar" style="${style}">${CREATOR.initial}</div>`;
}
function addPhoto(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => go({ photo: e.target.result });
  r.readAsDataURL(f);
}
function withTop(html){
  if (S.view !== "app") return html;
  if (S.tab === "coach") return `<button class="back" onclick="go({tab:'today'})">← Back</button>` + html;
  return `<div style="display:flex;justify-content:flex-end;margin:-6px 0 12px"><button class="msgbtn" onclick="go({tab:'coach'})">💬 Message ${CREATOR.name}</button></div>` + html;
}
function guard(html){ return S.subscribed ? html : `<button class="btn" onclick="go({view:'paywall'})">Unlock with membership</button>`; }
function answer(o){ S.answers[S.q]=o; if(S.q<QUIZ.length-1) go({q:S.q+1}); else go({view:'plan'}); }
function startWorkout(){ go({view:'player',player:{ex:0,set:1,resting:false,t:0}}); }
function quitPlayer(){ clearInterval(timerId); go({view:'app',tab:'today'}); }
function doneSet(){
  const p=S.player, ex=TODAY.exercises[p.ex];
  if(p.set<ex.sets){ p.set++; }
  else if(p.ex<TODAY.exercises.length-1){ p.ex++; p.set=1; }
  else { clearInterval(timerId); S.doneToday=true; S.streak++; go({view:'done'}); return; }
  p.resting=true; p.t=45; render();
  clearInterval(timerId);
  timerId=setInterval(()=>{ p.t--; const el=$("t"); if(el) el.textContent=p.t; if(p.t<=0) skipRest(); },1000);
}
function skipRest(){ clearInterval(timerId); S.player.resting=false; render(); }
function send(){
  const v=$("msg").value.trim(); if(!v) return;
  S.messages.push({me:true,text:v}); render();
  setTimeout(()=>{ S.messages.push({me:false,text:"(__NAME__ gets a notification. In the real app, his reply would show up here.)"}); if(S.tab==='coach'&&S.view==='app') render(); },1200);
}

   <p class="muted">Create your account to keep your streak and unlock all of ${CREATOR.name}'s programs.</p></div>
   <div style="margin-top:28px">
     <button class="btn" onclick="go({account:true,view:'paywall'})">Continue with Apple</button>
     <button class="btn ghost" onclick="go({account:true,view:'paywall'})">Continue with Google</button>
     <input class="field" style="margin-top:14px" placeholder="Or your email">
     <button class="btn ghost" onclick="go({account:true,view:'paywall'})">Continue with email</button></div>
   <p class="small center" style="margin-top:14px">No Instagram login needed.</p>`,

 f_login:()=>`<button class="back" onclick="go({view:'welcome'})">← Back</button>
   <h1 style="margin:10px 0 8px">Welcome back</h1><p class="muted">Log in to train with ${CREATOR.name}.</p>
   <div style="margin-top:22px">
     <button class="btn" onclick="go({account:true,subscribed:true,view:'app',tab:'today'})">Continue with Apple</button>
     <button class="btn ghost" onclick="go({account:true,subscribed:true,view:'app',tab:'today'})">Continue with Google</button>
     <input class="field" style="margin-top:14px" placeholder="Your email">
     <button class="btn ghost" onclick="go({account:true,subscribed:true,view:'app',tab:'today'})">Email me a login link</button></div>`
});

// highlight the current mode above the phone
const _renderBase=render;
render=function(){ _renderBase();
  const v=S.view, m=(v==="c_dash"||v==="c_payout")?"mD":(v.startsWith("c_")?"mC":"mF");
  ["mC","mF","mD"].forEach(id=>document.getElementById(id).classList.toggle("on",id===m)); };

render();

// Analytics: which demo screens are opened. Never sends what people type.
(function(){
  const DEMO="flow"; let last="", personalized=false;
  const _go=go;
  go=function(p){ _go(p); const k=S.view==="app"?"tab:"+S.tab:S.view; if(k!==last){ last=k; posthog.capture("demo_screen",{demo:DEMO,screen:k}); } };
  const _sn=setName;
  setName=function(v){ _sn(v); if(!personalized && v.trim()){ personalized=true; posthog.capture("demo_personalized",{demo:DEMO}); } };
})();
</script>
</body>
</html>
